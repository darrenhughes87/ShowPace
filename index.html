<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101211">
<meta name="robots" content="noindex, nofollow">
<!-- Share, then Add to Home Screen, opens ShowPace with no browser bars: best for a stage iPad -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ShowPace">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>ShowPace</title>
<style>
/* Layout: a slim top bar, then one working surface per view.
   Call: timer column | rundown | tech detail. Edit: one grid. Crew: Now beside Next/Then. Timer: full screen. */
:root{
  /* Green while it runs, orange near the end, red when it's over */
  --bg:#101211; --panel:#171a19; --panel2:#1f2321; --line:#2a2f2d; --line2:#38403c;
  --fg:#edf2ef; --muted:#95a09a; --dim:#7f8a84;
  --brand:#1F8F4E; --brand2:#3A9C63; --brand3:#62B183;
  --ok:#2fa35f; --warn:#F28C28; --warn-bg:#7a3d0c; --warn-bg2:#8f4a12; --bad:#E5483B; --bad-bg:#5c1f1a; --bad-bg2:#74281f;
  --display:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  /* Worked out from the main colour, so a new colour on the Admin page carries through. --on-brand flips to dark text on a pale colour. */
  --on-brand:#fff;
  --tint:color-mix(in srgb,var(--brand) 22%,var(--bg)); --tint2:color-mix(in srgb,var(--brand) 40%,var(--bg));
  --tint-fg:color-mix(in srgb,var(--brand3) 35%,#fff);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.4 var(--body);-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea,select{font:inherit;color:inherit}
button,.btn{cursor:pointer;background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:7px 12px;white-space:nowrap;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--brand3)}
.primary,.go{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:700}
.primary:hover,.go:hover{background:var(--brand2)}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand3);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)}
.lab{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--panel2);color:var(--fg);white-space:nowrap}
.chip.over{background:var(--bad-bg);color:#ffd5cf}.chip.under{background:#1d3f26;color:#cdf0d6}
.late.soft{background:none;color:#ff8f86;padding:0 0 0 2px}
.late{display:inline-block;text-transform:none;letter-spacing:0;white-space:nowrap;background:var(--bad);color:#fff;border-radius:4px;padding:0 5px;font-size:11px;font-weight:700;margin-left:3px;vertical-align:1px}
.r-row.is-live .late{background:#fff;color:var(--bad)}

/* Segment types: filled chips, never side stripes */
.k-talk{background:#1f4a33;color:#cdf0d6}.k-panel{background:#24405e;color:#d5e7fb}.k-break{background:#5a3a14;color:#ffe1bf}
.k-free{background:#1d4246;color:#cdeff1}.k-video{background:#5a2420;color:#ffd3cc}.k-music{background:#5a2643;color:#fbd6e9}.k-other{background:#3a363c;color:#e3dee5}

/* Top bar */
/* One row on desktop: brand · show · views ··· detail · status · crew. Under 1000px the views and detail drop to a second row. */
.top{position:sticky;top:env(safe-area-inset-top);z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;
  padding-block:8px;background:color-mix(in srgb,var(--bg) 96%,transparent);border-bottom:1px solid var(--line)}
.top .right{display:flex;align-items:center;gap:8px;margin-left:auto}
@media (max-width:999px){.top .seg{order:3}.top .right{order:4}.top .tabs{order:5;flex:1 1 100%}.top .tabs a{flex:1;text-align:center}}
/* Phones: the sync label becomes a coloured dot (its words are in the tooltip), so the header needs a row less */
@media (max-width:560px){.top .sync{width:12px;height:12px;padding:0;font-size:0;background:var(--muted)}.top .sync.ok{background:var(--ok)}.top .sync.bad{background:var(--bad)}}
.crew-menu{position:relative}
.crew-menu summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-width:128px}
.crew-menu summary::-webkit-details-marker{display:none}
.crew-menu summary.on{background:#1d3f26;border-color:#2e6a3d;color:#cdf0d6;font-weight:700}
.crew-menu .menu{position:absolute;right:0;top:calc(100% + 6px);z-index:8;width:280px;display:grid;gap:6px;padding:12px;
  background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.5)}
.crew-menu .menu p{margin:0 0 4px;color:var(--muted);font-size:12px;line-height:1.4}
.crew-menu .menu button{text-align:left}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top);background:var(--bg);z-index:10}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo span{font:700 18px/1 var(--body);color:var(--brand3);letter-spacing:-.01em}
.show-name{display:grid;min-width:0;flex:1 1 110px}
.show-name b{font:400 17px/1.2 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.show-name small{color:var(--muted);font-size:12px}
.tabs,.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.tabs a,.seg button{border:0;background:none;border-radius:6px;padding:6px 12px;color:var(--muted);text-decoration:none;font-weight:700;font-size:13px}
.tabs a:hover,.seg button:hover{color:var(--fg)}
.tabs a[aria-current="page"],.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.sync{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--panel2);color:var(--muted);width:76px;text-align:center;white-space:nowrap}
.sync.ok{background:#1d3f26;color:#cdf0d6}.sync.bad{background:var(--bad-bg);color:#ffd5cf}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;
  background:var(--fg);color:var(--bg);font-weight:700;border-radius:8px;padding:10px 16px}

/* Login */
.login{max-width:360px;margin:12vh auto 0;display:grid;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px}
.login h1{font:700 30px/1 var(--display);margin:4px 0 0;color:var(--brand3);letter-spacing:-.02em}
.login p{margin:0}
.login label,.form label{display:grid;gap:5px;font-size:12px;color:var(--muted)}
input.f,.login input,.form input{background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:9px 11px;font-size:15px}
.err{color:#ffb4ab}

/* Caller remote: the QR card that stays up, and the phone remote */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.72)}
.modal-card{width:min(420px,100%);display:grid;gap:12px;justify-items:center;text-align:center;background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:22px}
.modal-card h2{font:400 24px/1.2 var(--display);margin:0}
.modal-card p{margin:0;color:var(--muted);font-size:13px}
.qr{width:min(300px,70vw);background:#fff;border-radius:10px;padding:10px}
.qr svg{display:block;width:100%;height:auto}
.modal-card code{font-size:12px;word-break:break-all;user-select:all;color:var(--fg)}
.modal-card .row{display:flex;gap:8px}
.remote{display:grid;gap:12px;padding-block:14px calc(20px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
.remote .r-next{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}  /* one line, so the controls below never move */
.remote .r-next .lab{margin-bottom:4px;height:18px;line-height:18px}
@media (max-width:899px){.remote{padding-bottom:calc(110px + env(safe-area-inset-bottom))}}  /* room for the controls fixed at the bottom */
.remote form{display:grid;gap:10px}

/* Crew page */
.crew-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;text-decoration:none}
a.crew-card:hover{border-color:var(--brand3)}
.crew-card .d{font-size:13px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.crew-card h2{font:400 22px/1.25 var(--display);margin:4px 0 0}
.crew-card .btn{padding:12px 22px;font-size:16px}
.crew-pass{display:flex;gap:8px;grid-column:1/-1}
.crew-pass input{flex:1;min-width:0}
.crew-card .err{grid-column:1/-1;margin:0}

/* Shows list */
.shows{max-width:1100px;margin:0 auto;padding-block:22px 60px}
.shows-head{display:flex;flex-wrap:wrap;align-items:end;gap:12px;margin-bottom:16px}
.shows-head h1{font:400 32px/1 var(--display);margin:0 auto 0 0}
.form{display:flex;flex-wrap:wrap;gap:12px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.form .grow{flex:1;min-width:220px}
.form .check{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--fg);min-height:40px}
.form input[type=color]{width:72px;height:40px;padding:3px;cursor:pointer}
.form .full{flex-basis:100%;margin:0}
.admin h2.lab{margin:26px 0 10px}
.show-row.user-row{grid-template-columns:minmax(0,1fr) auto}
.list{display:grid;gap:8px}
.show-row{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:6px 16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.show-row.today{background:var(--tint);border-color:var(--tint2)}
.show-row.arch{opacity:.55}
.show-row .d{font-weight:700;font-variant-numeric:tabular-nums}
.show-row .d small{display:block;color:var(--muted);font-weight:400}
.show-row h2{font:400 19px/1.25 var(--display);margin:0}
.show-row h2 a{text-decoration:none}
.show-row .meta2{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.show-row .acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:end}
.empty{background:var(--panel);border:1px dashed var(--line2);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
@media (max-width:700px){.show-row{grid-template-columns:1fr}.show-row .acts{justify-content:start}}

/* Editor grid */
.edit{padding-block:14px 60px}
.meta{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:12px}
.meta label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.meta input{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
.meta .m-title{font:400 22px/1.2 var(--display);flex:1;min-width:min(420px,100%);background:transparent;border-color:transparent;padding-left:0}
.meta .m-title:hover,.meta .m-title:focus{border-color:var(--line2);padding-left:9px}
.sum{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
.sum b{color:var(--fg)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tools .sp{flex:1}
.grid-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:calc(100vh - 210px)}
.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.grid th{position:sticky;top:0;z-index:2;background:var(--panel2);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
.grid td{border-bottom:1px solid var(--line);padding:3px;vertical-align:top;background:var(--bg)}
.grid tr:nth-child(even) td{background:color-mix(in srgb,var(--bg) 94%,#fff)}
.grid td.t{padding:8px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--brand3);white-space:nowrap}
/* The fixed Start after a Free: an input whose text sits exactly where the plain times do (3px cell + 1px border + 4px padding = 8px) */
.grid td.t:has(input){padding:3px}
.grid td.free-dur{padding:9px 10px}  /* lines up with the duration boxes: 3px cell + 1px border + 5px/6px padding */
.grid td.t input{padding:4px;width:auto;min-height:0;line-height:1.35}
.grid td.t input::-webkit-calendar-picker-indicator{opacity:.5;margin-left:4px;padding:0}
.grid input,.grid textarea{width:100%;background:transparent;border:1px solid transparent;border-radius:5px;padding:5px 6px;resize:none;field-sizing:content;min-height:30px;line-height:1.35}
.grid input:hover,.grid textarea:hover{border-color:var(--line2)}
.grid input:focus,.grid textarea:focus{border-color:var(--brand3);background:var(--panel);outline:0}
.grid [readonly]{cursor:default}
.grid [readonly]:hover{border-color:transparent}
.seg-cell{display:flex;gap:6px;align-items:start}
.seg-cell textarea{font-weight:700}
.grid select.kind{width:auto;min-width:64px;flex:none;min-height:24px;margin-top:3px;padding:2px 6px;border-radius:999px;font-size:11px;font-weight:700;appearance:none;text-align:center;border:0}
.k-none{background:var(--panel2);color:var(--dim)}
.c-cue{width:56px}.c-start{width:96px}.c-dur{width:76px}.c-title{min-width:260px}.c-who{min-width:150px}
.c-audio,.c-lx,.c-vid,.c-notes{min-width:170px}
.grid td.act{white-space:nowrap;padding:4px}
.grid td.act button{padding:3px 7px;background:none;border-color:transparent;color:var(--dim)}
.grid td.act button:hover{color:var(--fg);border-color:var(--line2)}
.grid tr.hdr td{background:var(--tint)!important;border-bottom-color:var(--tint2)}
.grid tr.hdr input{font:400 16px/1.2 var(--display);color:var(--tint-fg);width:auto;min-width:min(420px,70vw)}
.hdr-cell{display:flex;align-items:center;gap:12px;padding-left:4px}
.hsum{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.grid tr.is-live td{background:color-mix(in srgb,var(--brand) 45%,var(--bg))!important}
.grid tr.is-done td{opacity:.45}

/* Call (controller) */
.call{display:grid;gap:14px;padding-block:14px 110px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.call{grid-template-columns:360px minmax(0,1fr);padding-bottom:20px;height:calc(100vh - 58px)}}
@media (min-width:1280px){.call{grid-template-columns:380px minmax(0,1fr) 320px}}
@media (min-width:900px) and (max-width:1279px){.call:not(.simple){grid-template-rows:minmax(0,3fr) minmax(0,2fr)}.call:not(.simple) .c-timer{grid-row:1/3}}  /* iPad landscape: Now and Next sit under the running order */
.call>div{min-width:0}
@media (min-width:900px){.c-list,.c-detail{overflow:auto}.c-timer{overflow:auto}}
.call.simple{grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.call.simple{grid-template-columns:420px minmax(0,1fr)}}
.timer{--h2:22px;position:relative;overflow:hidden;border-radius:14px;padding:18px;border:1px solid transparent;color:var(--on-brand);background:linear-gradient(118deg,var(--brand) 0 70%,var(--brand2) 70%)}
.t-over .timer.is-live{background:linear-gradient(118deg,var(--bad-bg) 0 70%,var(--bad-bg2) 70%)}
.timer.idle{background:var(--panel);border:1px solid var(--line);color:var(--fg)}
.timer .lab{color:inherit;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:1.4em}
/* A message on the speaker's clock: shown in the Now line on Call, Crew and the remote, so nothing moves */
.timer .lab.has-msg{opacity:1}
.msg-on{background:#ffd400;color:#111;border-radius:4px;padding:0 6px;text-transform:none;letter-spacing:0}
.msg-x{background:none;border:0;padding:0 5px;margin:0;font:inherit;line-height:inherit;color:inherit;cursor:pointer}
.msg-dlg{background:var(--panel);color:var(--fg);border:1px solid var(--line2);border-radius:14px;padding:18px;width:min(440px,92vw)}
.msg-dlg::backdrop{background:rgba(0,0,0,.6)}
.msg-dlg form{display:grid;gap:12px}
.msg-pre{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.msg-pre button{min-height:44px}
.msg-dlg input{background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:10px 11px;font-size:16px}
.msg-acts{display:flex;gap:8px;justify-content:flex-end}
.msg-now{margin:0;height:1.6em;line-height:1.6em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-acts .primary{min-width:90px}
.msg-btn{width:100%;min-height:44px;margin-top:10px}
@keyframes msgflash{50%{opacity:.1}}
.flash{animation:msgflash .5s step-end 3}
.t-over .timer.is-live{color:#fff}
.timer.idle .lab{color:var(--muted)}
/* Fixed slots so the card never changes height: three lines of title, one of who, one countdown height */
/* Title and who sit together at the top; the room kept for a three-line title falls below them, so the card's height never changes */
.timer .head{height:calc(var(--h2) * 3.6 + 28px)}
.timer h2{font:400 var(--h2)/1.2 var(--display);margin:8px 0 2px;text-wrap:balance;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.timer .who{margin:0;opacity:.8;font-size:13px;height:1.4em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{font:700 clamp(64px,9vw,104px)/1 var(--body);font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin:16px 0 4px;height:clamp(64px,9vw,104px);display:flex;align-items:center}
.count.plus::before{content:'+';font-size:.5em;margin-right:.08em;opacity:.85}
.t-warn .count{color:#ffc27d}
.t-warn .timer.is-live{background:linear-gradient(118deg,var(--warn-bg) 0 70%,var(--warn-bg2) 70%);color:#fff}.t-warn .timer.is-live .count{color:#fff}
.count.long{font-size:clamp(44px,5.6vw,72px)}  /* an hour or more: h:mm:ss must still fit */
.tv .count.long{font-size:min(24vh,17vw)}
.timer .sub{margin:0 0 12px;opacity:.85;font-size:13px;font-variant-numeric:tabular-nums}
.prog{height:8px;border-radius:4px;background:rgba(0,0,0,.32);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:#7fd598;border-radius:4px}
.t-warn .prog i{background:var(--warn)}.t-over .prog i{background:#ff8a7f}
.controls{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;margin-top:10px}
.controls .go{min-height:48px;font-size:18px}
.controls .wide{grid-column:1/-1}
.tt,.hold{display:grid;gap:8px;margin-top:10px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.tt-head{display:flex;align-items:center;gap:8px;height:30px}
.tt-head button{padding:3px 10px;font-size:12px}
.tt-head .lab{margin-right:auto}
.tt-head b{font-size:13px;color:var(--fg);font-variant-numeric:tabular-nums}
/* One line: estimated end, new end, minutes saved, go */
.tt-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.1fr) minmax(0,.8fr) auto;gap:8px;align-items:end}
.tt-grid label{display:grid;gap:4px;font-size:11px;color:var(--muted);white-space:nowrap}
.tt-grid b{font-size:17px;padding:5px 0;font-variant-numeric:tabular-nums}
.tt-grid input{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:5px 7px;font-size:16px;font-variant-numeric:tabular-nums}
.tt-grid input::-webkit-calendar-picker-indicator{display:none}
.tt-grid .primary{min-height:34px;padding:6px 12px}
/* Over time: same size, greyed out, a note on the title line. Nothing on the screen moves. */
.tt-msg{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tt:not(.is-over) .tt-msg,.tt.is-over .tt-head b,.tt.is-over .tt-head button{display:none}
.tt-head.idle b,.tt-head.idle button{visibility:hidden}
.tt.is-over .tt-grid{opacity:.4}
.hold{grid-template-columns:repeat(4,minmax(0,1fr))}
.hold .lab{grid-column:1/-1;line-height:22px}
.hold button{min-height:34px;padding:6px 8px}
.hold [data-a="holdOff"]{grid-column:4;grid-row:2}  /* phone: 5m 10m 20m Stop, then minutes and play */
.hold input{grid-column:span 2;min-width:0;background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:5px 7px;font-size:16px}
.hold .primary{grid-column:span 2}

function planned() {
  let t = startMs();
  const starts = show.items.map(it => { const s = t; t = isFree(it) ? untilMs(it, t) : isH(it) ? t : t + it.dur * 1000; return s; });
  return {starts, end:t};
}
// Planned times, replaced by what actually happened, then pushed on from now for everything still to come.
function expected(now) {
  const p = planned(), st = state();
  if (st === 'ready' || st === 'empty') return p;
  const starts = p.starts.slice();
  for (const l of show.live.log) { const k = idx(l.id); if (k >= 0) starts[k] = l.start; }
  if (st === 'done') return {starts, end:show.live.log.at(-1)?.end ?? p.end};
  const i = liveIdx();
  starts[i] = show.live.at;
  let t = isFree(show.items[i]) ? untilMs(show.items[i], now) : Math.max(now, show.live.at + durOf(show.items[i]) * 1000);
  for (let k = i + 1; k < starts.length; k++) { starts[k] = t; t = after(show.items[k], t); }
  return {starts, end:t};
}
function drift(now) {
  const d = Math.round((expected(now).end - planned().end) / 1000);
  return Math.abs(d) < 30 ? ['On time', ''] : d > 0 ? [`${fmtDur(d)} over`, 'over'] : [`${fmtDur(d)} under`, 'under'];
}
const blank = () => ({id:uid(), cue:`Q${show.items.filter(x => !isH(x)).length + 1}`, title:'', who:'', dur:300, kind:'', audio:'', lx:'', vid:'', notes:''});

    : [['edit', 'Edit', base], ['call', 'Call', base + '/call'], ['crew', 'Crew', base + '/crew'], ['timer', 'Clock', base + '/timer']];
  $('#top').innerHTML = `<a class="logo" href="${R.token ? '/crew' : '#'}" title="${R.token ? "Today's shows" : 'All shows'}"><span>${appName()}</span></a>
    <div class="show-name"><b>${esc(show.title || 'Untitled show')}</b><small>${fmtDate(show.date)}</small></div>
    <nav class="tabs" aria-label="View">${tabs.map(([v, l, h]) => `<a href="${h}"${R.view === v ? ' aria-current="page"' : ''}>${l}</a>`).join('')}</nav>
    <div class="seg" role="group" aria-label="Detail"><button data-a="mode" data-v="0" aria-pressed="${!simple}">Technical</button><button data-a="mode" data-v="1" aria-pressed="${simple}">Simple</button></div>
    <div class="right"><span class="sync" data-t="sync"></span>${R.token ? '' : `
      <details class="crew-menu"><summary class="btn${show.onCrew ? ' on' : ''}">${show.onCrew ? 'Live to crew' : 'Crew'} ▾</summary>
        <div class="menu"><p>${show.onCrew ? `On the crew page${show.crewLocked ? ', with a password' : ', crew go straight in'}.` : 'Not live to crew. Crew links say the show is not open yet until you push live.'}</p>
          <button data-a="pushLive" class="${show.onCrew ? '' : 'primary'}">${show.onCrew ? 'Take off the crew page' : 'Push live'}</button>
          <button data-a="message">Message the speaker</button>
          <button data-a="copyLink">Copy this show's crew link</button><button data-a="crewPage">Copy crew page link</button>
          <button data-a="remote">${show.remoteOn ? 'Caller remote: show QR' : 'Set up caller remote'}</button>${show.remoteOn ? '<button data-a="remotePass">New remote password</button>' : ''}</div></details>`}</div>`;
  syncChip();
}
const techGrid = it => {
  const f = it ? TECH.filter(([k]) => it[k]) : [];
  return f.length ? `<dl class="tech">${f.map(([k, h]) => `<div><dt>${h}</dt><dd>${esc(it[k])}</dd></div>`).join('')}</dl>` : '';
};
// The message on the speaker's clock, in the Now line. Whoever can call the show gets a ✕ to clear it.
const msgFresh = () => nowMs() - (show.live.msg?.at || 0) < 2500;  // flash only when it's just been sent, not on every redraw
function msgChip() {
  const m = show.live.msg;
  if (!m) return '';
  const x = canEdit() || remoteKey() ? '<button class="msg-x" data-a="msgClear" title="Take the message off the clock" aria-label="Clear the message">✕</button>' : '';
  return ` · <span class="msg-on${msgFresh() ? ' flash' : ''}">${esc(m.text)}</span>${x}`;
}
// The open pop-up follows what's on the clock, even when the phone remote or a Complete changes it. Same buttons, same places.
function msgSync() {
  const d = $('#msg-dlg'), m = show?.live.msg;
  if (!d) return;
  d.querySelector('[data-msg-now]').innerHTML = m ? `On the clock now: <span class="msg-on">${esc(m.text)}</span>` : 'Nothing on the clock';
  d.querySelector('[data-a="msgClear"]').disabled = d.querySelector('[data-a="msgFlash"]').disabled = !m;
}
function timerCard(withTech) {
  const st = state(), i = liveIdx();
  // Same slots in every state, so the card is always the same height
  const slots = (cls, lab, h2, who, count, sub, prog, extra = '') => `<section class="timer ${cls}"><div class="lab${show.live.msg ? ' has-msg' : ''}">${lab}${msgChip()}</div><div class="head"><h2>${h2}</h2><p class="who">${who}</p></div>
    <div class="count" data-t="count">${count}</div><p class="sub" data-t="sub">${sub}</p><div class="prog"><i data-t="prog" style="width:${prog}%"></i></div>${extra}</section>`;
  if (st === 'empty') return slots('idle', 'Nothing to run yet', 'Add segments in Edit', '', '0:00', '', 0);
  // Holding (crew arriving) and Thank you (show over): the event name and the time of day, then the countdown takes over
  const extra = withTech && !simple ? '<dl class="tech"></dl>' : '';
  if (show.live.hold) return slots('is-live', 'Adhoc', '&nbsp;', '', fmtDur(show.live.hold.dur), '', 0, extra);
  if (st === 'ready') return slots('idle', 'Before the show', esc(show.title || 'Untitled show'), `First cue ${hm(planned().starts[nextIdx(-1)])}`, hms(nowMs()), 'Time now', 0, extra);
  if (st === 'done') return slots('idle', 'Show complete', 'Thank you', `Finished ${hm(expected(nowMs()).end)} · planned ${hm(planned().end)}`, hms(nowMs()), 'Time now', 100, extra);
  const it = show.items[i];
  return slots('is-live', 'Now', esc(it.title || 'Untitled'), esc(it.who), isFree(it) ? hms(nowMs()) : fmtDur(it.dur), '', 0, withTech && !simple ? techGrid(it) || '<dl class="tech"></dl>' : '');
}
function card(label, it) {
  if (!it) return `<section class="d-card"><div class="lab">${label}</div><h3>End of show</h3></section>`;
  return `<section class="d-card"><div class="lab">${label} · <span data-exp="${idx(it.id)}"></span></div>
    <h3>${esc(it.title || 'Untitled')}</h3><p>${[esc(it.who), isFree(it) ? 'Free time' : fmtDur(it.dur)].filter(Boolean).join(' · ')}</p>${simple ? '' : techGrid(it)}</section>`;
}
function rundown(from = 0) {
  const st = state(), i = liveIdx(), nx = st === 'live' ? nextIdx(i) : nextIdx(-1);
  const log = Object.fromEntries(show.live.log.map(l => [l.id, l]));
  return `<div class="rlist">${show.items.map((it, k) => k < from ? '' : isH(it)
    ? `<div class="r-hdr"><span>${esc(it.title || 'Section')}</span><span data-hsum="${k}"></span></div>`
    : `<div class="r-row${k === i ? ' is-live' : log[it.id] ? ' is-done' : k === nx ? ' is-next' : ''}" data-i="${k}">
        <span class="r-t" data-exp="${k}"></span>
        <span class="r-d">${log[it.id] ? fmtDur((log[it.id].end - log[it.id].start) / 1000) : isFree(it) ? 'free' : fmtDur(it.dur)}</span>
        <span class="r-main"><b>${esc(it.title || 'Untitled')}</b>${it.who ? `<small>${esc(it.who)}</small>` : ''}</span>
        ${kindOf(it) ? `<span class="chip k-${kindOf(it)}">${KINDS[kindOf(it)]}</span>` : '<span class="slot"></span>'}
        ${canEdit() && k !== i && R.view === 'call' ? '<button class="r-go" data-a="goto" title="Jump to this segment now">Go</button>' : '<span></span>'}
      </div>`).join('')}</div>`;
}

let showArchived = false;
async function viewShows() {
  $('#top').innerHTML = `<a class="logo" href="#"><span>${appName()}</span></a><div class="show-name"><b>Shows</b></div>
    <div class="right"><span class="muted">${esc(me)}</span>${isAdmin ? '<a class="btn" href="#admin">Admin</a>' : ''}<button data-a="logout">Log out</button></div>`;
  let list = store.get('shows') || [];
  const draw = () => {
    // Today and upcoming first (soonest at the top), then past shows (most recent first)
    const t = today(), up = s => s.date >= t, when = s => s.date + s.start;
    const rows = list.filter(s => showArchived || !s.archived).sort((a, b) => up(b) - up(a) || (up(a) ? when(a).localeCompare(when(b)) : when(b).localeCompare(when(a))));
    $('#app').innerHTML = `<section class="shows wrap">
      <div class="shows-head"><h1>Shows</h1>
        <label class="muted"><input type="checkbox" id="arch"${showArchived ? ' checked' : ''}> Show archived</label>
        <button data-a="crewPage" title="One link for all crew: lists every show you have pushed live">Copy crew page link</button>
        <a class="btn" href="/template.csv" download="ShowPace running order template.csv" title="The columns ShowPace reads, with example rows">Download template</a>
        <button data-a="importFile" title="A running order as CSV or Excel (.xlsx) becomes a new show">Upload running order</button><button class="primary" data-a="newShow">New show</button></div>
      <form class="form" id="new" hidden>
        <label class="grow">Show name<input id="n-title" required placeholder="Client, event and venue"></label>
        <label>Date<input id="n-date" type="date" value="${today()}" required></label>
        <label>Start<input id="n-start" type="time" value="09:00" required></label>
        <button class="primary">Create show</button></form>
      <input type="file" id="file" accept=".csv,.tsv,.txt,.xlsx,.xlsm,.numbers,.json" hidden>
      <div class="list">${rows.length ? rows.map(s => `
        <article class="show-row${s.date === today() ? ' today' : ''}${s.archived ? ' arch' : ''}">
          <div class="d">${fmtDate(s.date)}<small>${s.date === today() ? 'Today · ' : ''}${esc(s.start)}</small></div>
          <div><h2><a href="#s/${s.id}">${esc(s.title || 'Untitled show')}</a></h2>
            <div class="meta2">${s.segments} segments · ${fmtDur(s.runtime)}${s.live ? ' · <span class="chip under">Live now</span>' : ''}${s.onCrew && !s.archived ? ` · <span class="chip k-talk">On crew page${s.crewLocked ? ', password' : ''}</span>` : ''}${s.archived ? ' · Archived' : ''}</div></div>
          <div class="acts"><a class="btn" href="#s/${s.id}">Edit</a><a class="btn primary" href="#s/${s.id}/call">Call</a>
            <button data-a="copyLink" data-token="${esc(s.viewToken)}">Crew link</button>
            <button data-a="archive" data-id="${s.id}">${s.archived ? 'Restore' : 'Archive'}</button>${s.archived ? `<button data-a="deleteShow" data-id="${s.id}" data-title="${esc(s.title)}">Delete</button>` : ''}</div>
        </article>`).join('') : `<div class="empty">No shows yet. Press New show to build your first running order.</div>`}</div></section>`;
    $('#arch').onchange = e => { showArchived = e.target.checked; draw(); };
    $('#new').onsubmit = async e => {
      e.preventDefault();
      const s = {title:$('#n-title').value.trim(), date:$('#n-date').value, start:$('#n-start').value, live:{id:null, at:null, log:[]},
        items:[{id:uid(), cue:'Q1', title:'', who:'', dur:300, kind:'', audio:'', lx:'', vid:'', notes:''}]};
      const r = await api('/api/shows', {method:'POST', body:JSON.stringify(s)});
      if (r.ok) location.hash = `#s/${r.data.id}`; else toast(r.data?.error || 'Could not create the show');
    };
    $('#file').onchange = async e => {
      const f = e.target.files[0]; e.target.value = '';
      if (!f) return;
      try {
        let r;
        if (/\.json$/i.test(f.name)) {  // an older export
          const s = JSON.parse(await f.text());
          r = await api('/api/shows', {method:'POST', body:JSON.stringify({...s, live:{id:null, at:null, log:[]}})});
        } else {  // CSV or Excel: the server reads it and builds the show
          const data = await new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(fr.result.split(',')[1]); fr.onerror = no; fr.readAsDataURL(f); });
          r = await api('/api/import', {method:'POST', body:JSON.stringify({name:f.name, data})});
        }
        if (!r.ok) throw Error(r.data?.error);
        toast('Show created. Check the date, name and timings.');
        location.hash = `#s/${r.data.id}`;
      } catch (x) { toast(x.message || 'That file could not be read'); }
    };
  };
  draw();
  try { const r = await api('/api/shows'); if (r.ok) { list = r.data; store.set('shows', list); draw(); } } catch {}
}

function viewEdit() {
  topShow();
  const ro = !canEdit(), dis = ro ? ' readonly' : '', tech = !simple, cols = COLS.filter(c => tech || !c.tech);
  const done = new Set(show.live.log.map(l => l.id));
  const acts = ro ? '' : `<td class="act"><button data-a="rowUp" title="Move up" aria-label="Move up">↑</button><button data-a="rowDown" title="Move down" aria-label="Move down">↓</button><button data-a="rowIns" title="Insert a segment below" aria-label="Insert below">+</button><button data-a="rowDel" title="Remove" aria-label="Remove">✕</button></td>`;
  const cell = (c, it, i) => {
    const fr = prevFree(i);

let ttTarget = null;  // the proposed new end while it's being filled in

  return `<section class="tt${live ? '' : ' is-over'}"><div class="tt-head${t ? '' : ' idle'}"><span class="lab">Time travel</span><span class="tt-msg">${msg}</span><b>On · ${t < 0 ? 'saving' : 'adding'} ${fmtDur(t)}</b><button data-a="ttOff"${off}>Back off</button></div>
    <div class="tt-grid"><label>Est. end<b data-t="ttEnd">${end || '--:--'}</b></label>

// Redraws keep your place: the page and every scrolling panel stay where you left them.
const SCROLLERS = ['.grid-wrap', '.c-list', '.c-detail', '.c-timer'];

  const list = $('.c-list') || $('.grid-wrap'), row = $('.r-row.is-live') || $('.r-row.is-next') || $('#grid tr.is-live');

/* ---------- once a second: numbers only, so buttons are never replaced mid-tap */
// Only touch what changed: four times a second all day, so an older iPad isn't redrawing for nothing

function tick() {

  setT('clock', hms(now)); setT('end', hm(ex.end)); setT('viewers', String(viewers));
  if ((st === 'ready' || st === 'done') && !show.live.hold) setT('count', hms(now));
  $$('[data-t="drift"]').forEach(el => { put(el, st === 'ready' ? 'Not started' : dt); el.className = 'chip ' + (st === 'ready' ? '' : dc); });

    const k = +el.dataset.exp, late = Math.round((ex.starts[k] - p.starts[k]) / 60000);

    const row = el.closest('.r-row, tr'), done = row?.classList.contains('is-done'), loud = !row || row.matches('.is-live, .is-next');
    const html = hm(p.starts[k]) + (late > 0 && !done ? ` <span class="late${loud ? '' : ' soft'}">+${late < 60 ? late + 'm' : Math.floor(late / 60) + 'h' + pad(late % 60)}</span>` : '');
    if (el._h !== html) { el._h = html; el.innerHTML = html; }

    for (let j = +el.dataset.hsum + 1; j < show.items.length && !isH(show.items[j]); j++) { s += show.items[j].dur; n++; }
    put(el, `${hm(p.starts[+el.dataset.hsum])} · ${n} ${n === 1 ? 'item' : 'items'} · ${fmtDur(s)}`);

    setT('sub', `Adhoc · ${over ? 'over' : 'left'} of ${fmtDur(h.dur)} · started ${hm(h.at)}`);
    $$('[data-t="prog"]').forEach(b => b.style.width = Math.min(100, Math.max(0, 1 - Math.max(left, 0) / h.dur) * 100) + '%');

    $$('.tt input, .tt button').forEach(x => x.disabled = over);

  complete() {
    const l = show.live, now = nowMs();
    l.log.push({id:l.id, start:l.at, end:now, ...bend(l)});
    l.id = show.items[nextIdx(liveIdx())]?.id ?? 'END'; l.at = now; fresh(l);
    save(); render();
  },
  back() {
    const l = show.live, last = l.log.pop();
    if (last) Object.assign(l, {id:last.id, at:last.start, ...bend(last), hold:null, msg:null}); else { l.id = null; l.at = null; fresh(l); }
    save(); render();
  },
  nudge(b) { shift(+b.dataset.s, false); },
  holdPick(b) { holdMins = b.dataset.m; render(); },  // picks the time; play starts it
  hold() {
    const m = +holdMins;
    if (!(m > 0 && m <= 600)) return toast('Pick or type the minutes first');
    show.live.hold = {at:nowMs(), dur:Math.round(m * 60)}; holdMins = ''; save(); render();
  },
  holdOff() { show.live.hold = null; save(); render(); },
  message() {  // a pop-up over everything, so nothing on the screen moves. It stays open, to change, flash or clear quickly.
    $('#msg-dlg')?.remove();
    const m = show.live.msg;
    document.body.insertAdjacentHTML('beforeend', `<dialog id="msg-dlg" class="msg-dlg"><form id="msg-form">
      <div class="lab">Message the speaker</div><p class="msg-now" data-msg-now></p>
      <div class="msg-pre">${['Wrap up', 'Speak up', 'Slow down', 'Questions now'].map(p => `<button type="button" data-a="msgPick" data-p="${p}">${p}</button>`).join('')}</div>
      <input id="msg-text" maxlength="60" placeholder="Or type your own" autocomplete="off" value="${esc(m?.text || '')}" aria-label="Message">
      <div class="msg-acts"><button type="button" data-a="msgClose">Close</button><button type="button" data-a="msgClear">Clear</button><button type="button" data-a="msgFlash">Flash</button><button class="primary">Send</button></div>
    </form></dialog>`);
    $('#msg-form').onsubmit = e => {
      e.preventDefault();
      const text = $('#msg-text').value.trim();
      if (!text) return toast('Pick or type a message first');
      show.live.msg = {text, at:nowMs()}; save(); render();
    };
    msgSync(); $('#msg-dlg').showModal();
  },
  msgPick(b) { $('#msg-text').value = b.dataset.p; $('#msg-text').focus(); },  // picks it; Send puts it up
  msgFlash() { if (show.live.msg) { show.live.msg.at = nowMs(); save(); render(); } },
  msgClear() { show.live.msg = null; save(); render(); },
  msgClose() { $('#msg-dlg')?.close(); $('#msg-dlg')?.remove(); },
  ttGo() {
    if (ttTarget == null || Math.abs(ttTarget - curEnd()) < 1000) return toast('Set a new end time or minutes saved first');
    shift((ttTarget - curEnd()) / 1000, true); ttTarget = null; render();
  },
  ttOff() { shift(-(show.live.travel || 0), true); ttTarget = null; render(); },
  goto(b) {  // two taps, so a stray touch can't jump the show
    if (!b.dataset.arm) { b.dataset.arm = 1; b.textContent = 'Go?'; setTimeout(() => { delete b.dataset.arm; b.textContent = 'Go'; }, 3000); return; }
    const l = show.live, now = nowMs();
    if (state() === 'live') l.log.push({id:l.id, start:l.at, end:now, ...bend(l)});
    else if (state() !== 'done') l.log = [];
    l.id = rowOf(b).id; l.at = now; fresh(l);
    save(); render();
  },
  reset() { if (confirm('Reset the show? This clears the live progress, not the running order.')) { show.live = {id:null, at:null, log:[]}; save(); render(); } },
  addRow() { show.items.push(blank()); save(); render(); $('#grid tbody tr:last-child textarea[data-f="title"]')?.focus(); },
  addHeader() { show.items.push({id:uid(), type:'header', title:''}); save(); render(); $('#grid tbody tr:last-child input')?.focus(); },
  rowUp(b) { move(b, -1); }, rowDown(b) { move(b, 1); },
  rowIns(b) {
    const i = +b.closest('[data-i]').dataset.i;
    show.items.splice(i + 1, 0, blank()); save(); render();
    $(`#grid tr[data-i="${i + 1}"] textarea[data-f="title"]`)?.focus();
  },
  rowDel(b) {
    const i = +b.closest('[data-i]').dataset.i, it = show.items[i];
    if (!confirm(`Remove "${it.title || (isH(it) ? 'this section' : 'this segment')}"?`)) return;
    if (it.id === show.live.id) { show.live.id = show.items[nextIdx(i)]?.id ?? 'END'; show.live.at = nowMs(); fresh(show.live); }
    show.items.splice(i, 1); save(); render();
  },
  export() {  // the same columns as the template, so a download can be edited in Excel and uploaded again
    const p = planned(), cell = v => /[",\n]/.test(v = String(v ?? '')) ? `"${v.replace(/"/g, '""')}"` : v;
    const rows = [['Cue', 'Start', 'End', 'Duration (mins)', 'Segment', 'Type', 'Who', 'Audio', 'Lighting', 'Video', 'Notes'],
      ...show.items.map((it, k) => isH(it) ? ['', '', '', '', it.title, 'Section']
        : [it.cue, hm(p.starts[k]), isFree(it) ? it.until || '' : hm(p.starts[k] + it.dur * 1000), isFree(it) ? '' : +(it.dur / 60).toFixed(2), it.title, kindOf(it) ? KINDS[kindOf(it)] : '', it.who, it.audio, it.lx, it.vid, it.notes])];
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['\ufeff' + rows.map(r => r.map(cell).join(',')).join('\r\n')], {type:'text/csv'}));  // BOM so Excel reads £ and accents
    a.download = `${(show.title || 'show').replace(/[^\w -]+/g, '').trim() || 'show'}.csv`;
    a.click(); URL.revokeObjectURL(a.href);
  },
  print() { window.print(); },
  fullscreen() {  // toggles; older iPad Safari only has the webkit-prefixed versions
    const el = document.documentElement, d = document;
    try {
      const go = isFull() ? (d.exitFullscreen || d.webkitExitFullscreen).call(d) : (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      go?.catch?.(() => {});
    } catch {}
  },
};
async function setRemotePass() {  // a remote password of its own, separate from crew passwords and logins
  const pw = prompt('Caller remote password.\n\nAnyone with this and the QR can press Start, Complete and Back from a phone. A new password locks out phones using the old one.', '');
  if (!pw) { if (pw === '' && show.remoteOn && confirm('Switch the caller remote off?')) await sendRemote(''); return false; }
  return sendRemote(pw);
}
async function sendRemote(pass) {
  const r = await api(`/api/shows/${show.id}/remote`, {method:'POST', body:JSON.stringify({pass})}).catch(() => null);
  if (!r?.ok) { toast('Could not reach the server'); return false; }
  show.remoteOn = r.data.remoteOn; cachePut(); render();
  return show.remoteOn;
}
// ±1m: the countdown jumps. Time travel: the real end moves, and the speaker's countdown speeds up or slows down to meet it.
function shift(s, travel) {
  if (isFree(show.items[liveIdx()])) return toast('Free time has no countdown');
  const l = show.live, now = nowMs(), shown = shownLeft(now), left = realLeft(now);
  if (left <= 0) return toast('This segment is already over time');
  if (s < 0 && left <= 10) return toast('Less than 10 seconds left');
  if (s < 0) s = Math.max(s, 10 - left);  // always leave at least 10 seconds
  const k = travel ? 'travel' : 'nudge';
  l[k] = (l[k] || 0) + s;
  if (travel || l.tt) l.tt = {d0:travel ? shown : shown + s, r0:realLeft(now)};
  save(); tick();
}
const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
// Esc, the iPad's own close button, or ours: keep the label honest whichever way full screen ends.
for (const ev of ['fullscreenchange', 'webkitfullscreenchange']) document.addEventListener(ev, () => setT('fs', isFull() ? 'Exit full screen' : 'Full screen'));
function move(b, d) {
  const L = show.items, i = +b.closest('[data-i]').dataset.i, it = L[i], act = b.dataset.a, before = b.getBoundingClientRect().top;
  // A heading moves on its own, one row at a time, like any row. (Carrying its rows along reversed them.)
  const j = i + d; if (j < 0 || j >= L.length) return; [L[i], L[j]] = [L[j], L[i]];
  save(); render();
  // Keep the moved row under the pointer, so pressing again moves the same row again.
  const nb = $(`#grid tr[data-id="${CSS.escape(it.id)}"] [data-a="${act}"]`);
  if (nb) { $('.grid-wrap').scrollTop += nb.getBoundingClientRect().top - before; nb.focus({preventScroll:true}); }
}
const LIVE_ACTS = new Set(['start', 'complete', 'back']);
let lastLive = 0;
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  $$('details.crew-menu[open]').forEach(d => { if (b || !d.contains(e.target)) d.open = false; });
  if (!b || !ACT[b.dataset.a]) return;
  e.preventDefault();
  // A double-click or double-tap on Start, Complete or Back counts once, so it can't skip a segment
  if (LIVE_ACTS.has(b.dataset.a)) { if (Date.now() - lastLive < 1500) return; lastLive = Date.now(); }
  ACT[b.dataset.a](b);
});
document.addEventListener('input', e => {
  if (e.target.id === 'hold-m') { holdMins = e.target.value; return $$('.hold .sel').forEach(x => x.classList.remove('sel')); }
  if (e.target.id === 'tt-end' || e.target.id === 'tt-save') return ttSync(e.target.id === 'tt-end' ? 'end' : 'save');  // Call and the remote
  if (!canEdit() || !show) return;
  if (e.target.dataset.until) { show.items[+e.target.dataset.until].until = e.target.value; save(); return tick(); }
  const f = e.target.dataset.f, m = e.target.dataset.m;
  if (m) { show[m] = e.target.value; save(); if (m === 'title') $('.show-name b').textContent = e.target.value || 'Untitled show'; return tick(); }
  if (!f || f === 'dur') return;
  rowOf(e.target)[f] = e.target.value;
  save();
  if (f === 'kind') render();  // Free changes the row's cells
});
document.addEventListener('change', e => {
  if (!canEdit() || e.target.dataset.f !== 'dur') return;
  const it = rowOf(e.target), d = parseDur(e.target.value);
  if (d != null) it.dur = d;
  e.target.value = fmtDur(it.dur); save(); tick();
});

// Keep the screen on wherever someone might be watching a show (before Start too); let it sleep in Edit and Shows.
// A page can only ask. On a stage iPad, also set Auto-Lock to Never in Settings.
let lock = null;
async function wake() {
  try {
    const want = ['call', 'crew', 'timer', 'remote'].includes(R.view) && show && document.visibilityState === 'visible';
    if (want && !lock) { lock = await navigator.wakeLock?.request('screen'); lock?.addEventListener('release', () => lock = null); }
    if (!want && lock) { lock.release(); lock = null; }
  } catch {}
}
document.addEventListener('visibilitychange', wake);

/* ---------- router */
applyBrand(store.get('brand'));  // last known look straight away, then the server's
const brandReady = fetch('/api/brand').then(r => r.json()).then(applyBrand).catch(() => {});
async function go() {
  await brandReady;
  R = route();
  if (R.view === 'crewlist') { closeShow(); return viewCrewList(); }
  if (R.view === 'shows' || R.view === 'admin') {
    closeShow(); document.body.dataset.view = 'shows';
    if (await ensureMe()) R.view === 'admin' ? viewAdmin() : viewShows();
    return;
  }
  if (!R.token && !(await ensureMe())) return;
  if (sid !== (R.token ? 'v:' + R.token : R.id) && !(await openShow())) return;
  render();
}
addEventListener('hashchange', go);
addEventListener('online', () => dirty && push());
go();

// Open any ShowPace page with ?selftest to check the time maths.
if (location.search.includes('selftest')) {
  const ok = (c, m) => { if (!c) throw Error('selftest: ' + m); };
  ok(parseDur('5') === 300 && parseDur('5:30') === 330 && parseDur('1:00:05') === 3605 && parseDur('abc') === null, 'parseDur');
  ok(bestSkew([{rtt:30000, off:-25000}, {rtt:80, off:1200}, {rtt:9000, off:-7000}]) === 1200, 'the quickest answer sets the clock');
  ok(fmtDur(330) === '5:30' && fmtDur(3605) === '1:00:05' && fmtDur(-75) === '1:15', 'fmtDur');
  const keep = show, t0 = new Date('2026-11-04T19:00').getTime();
  show = {date:'2026-11-04', start:'19:00', items:[{id:'h', type:'header'}, {id:'a', dur:600}, {id:'b', dur:300}], live:{id:'a', at:t0 + 120e3, log:[]}};
  ok(planned().end === t0 + 900e3, 'planned end, headers take no time');
  ok(expected(t0 + 5 * 60e3).starts[2] === t0 + 12 * 60e3, 'late start pushes next');
  ok(expected(t0 + 20 * 60e3).starts[2] === t0 + 20 * 60e3, 'overrun pushes next to now');
  show.live.nudge = 60;
  ok(expected(t0 + 5 * 60e3).starts[2] === t0 + 13 * 60e3, '+1m pushes next');
  ok(drift(t0 + 5 * 60e3)[1] === 'over', 'drift over');
  // 10:00 segment, time travel −1m at the start: it really ends after 9:00, and the speaker sees 5:00 at 4:30
  show.live = {id:'a', at:t0, log:[], nudge:0, travel:-60, tt:{d0:600, r0:540}};
  ok(Math.round(shownLeft(t0 + 270e3)) === 300, 'time travel runs the countdown fast');
  ok(Math.round(realLeft(t0 + 540e3)) === 0 && expected(t0).starts[2] === t0 + 540e3, 'time travel saves the minute');
  ok(Math.round(shownLeft(t0 + 600e3)) === -60, 'after the real end it counts over in real seconds');
  // free time anchors the next cue, absorbs an earlier overrun, and pushes on if it runs past its time
  show = {date:'2026-11-04', start:'09:00', items:[{id:'a', dur:600}, {id:'f', kind:'free', until:'10:00', dur:0}, {id:'b', dur:300}], live:{id:null, at:null, log:[]}};
  const t9 = new Date('2026-11-04T09:00').getTime();
  ok(planned().starts[2] === t9 + 3600e3 && planned().end === t9 + 3900e3, 'free runs until its time');
  show.live = {id:'f', at:t9 + 1500e3, log:[{id:'a', start:t9, end:t9 + 1500e3}]};
  ok(expected(t9 + 1800e3).starts[2] === t9 + 3600e3, 'an earlier overrun is absorbed');
  ok(expected(t9 + 3900e3).starts[2] === t9 + 3900e3, 'running past the time pushes on');
  show = keep;
  console.log('selftest passed');
}
</script>
